name: lg3_tvtl_qlnn
description: "Phần mềm tư vấn tâm lý và quản lý thi đua - trường THPT Lạng Giang 3"
publish_to: 'none'
version: 2.0.0+6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  webview_flutter: ^4.8.0
  device_info_plus: ^10.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  mobile_scanner: ^5.1.1
  firebase_messaging: ^15.0.4
  firebase_core: ^3.3.0
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.9.0
  dio: ^5.5.0
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  encrypt: ^5.0.3
  image_cropper: ^12.0.0
  flutter_displaymode: ^0.6.0
  http_parser: ^4.0.2
  connectivity_plus: ^6.0.3  # Từ cấu trúc build, có thể được sử dụng
  file_picker: ^8.0.3 # Hoặc ^8.1.2, cứ đổi số 6 thành số 8 là bao mượt
  ffmpeg_kit_flutter_new: ^4.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11  # Nếu cần cho code generation

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/lg3512512.png" 
  min_sdk_android: 24

# BẮT ĐẦU PHẦN CẤU HÌNH FLUTTER (PHẢI SÁT LỀ TRÁI)
flutter:
  uses-material-design: true

  assets:
    - assets/images/lg3512512.png
    - assets/images/lg3100100.png

  fonts:
    - family: Inter
      fonts:
        # TÊN FILE KHỚP VỚI ẢNH CHỤP
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf